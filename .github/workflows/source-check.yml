name: Scheduled source checks

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      publish_reviewed_programs:
        description: Publish Repository-reviewed Programs and Activities after the Source check
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: welfare-source-check
  cancel-in-progress: false

jobs:
  persist-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, hash, and persist immutable Drafts
        id: source_check
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --no-install tsx scripts/check-sources.ts --persist --json ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} > source-report.json
      - name: Publish Repository-reviewed Program and Activity updates
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_reviewed_programs }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --no-install tsx scripts/seed-reviewed-programs.ts --apply --publish-reviewed-updates
      - name: Audit Published data acceptance
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_reviewed_programs }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run data:audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-${{ github.run_id }}
          path: source-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report or resolve Source monitoring issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHECK_OUTCOME: ${{ steps.source_check.outcome }}
        run: |
          title="Source monitoring failure"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ "$SOURCE_CHECK_OUTCOME" = "failure" ]; then
            message="Scheduled Source check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$issue" ]; then gh issue comment "$issue" --body "$message"; else gh issue create --title "$title" --body "$message"; fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Source checks recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$issue" --reason completed
          fi
      - name: Preserve Source check failure status
        if: ${{ steps.source_check.outcome == 'failure' }}
        run: exit 1
